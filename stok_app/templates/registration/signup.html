{% extends "base.html" %}

{% block title %}🚀 Üye Ol{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4" style="width: 400px;">
        <h2 class="text-center">🚀 Üye Ol</h2>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Kullanıcı Adı</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                {{ form.email }}
            </div>

            <div class="form-group">
                <label for="password1">Parola</label>
                {{ form.password1 }}
            </div>

            <div class="form-group">
                <label for="password2">Parola Onay</label>
                {{ form.password2 }}
            </div>

            <button type="submit" class="btn btn-success w-100 mt-3">✅ Üye Ol</button>
        </form>

        <p class="text-center mt-3">
            Zaten hesabın var mı? 
            <a href="{% url 'login' %}" class="text-primary font-weight-bold">Giriş Yap</a>
        </p>
    </div>
</div>
{% endblock %}
